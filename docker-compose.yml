services:
  jobs-db:
    image: postgres:16-alpine
    container_name: jobs-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mame
      POSTGRES_DB: dadu_jobs
    volumes:
      - strapi-data:/var/lib/postgresql/data
    networks:
      - jobs-net

  strapi:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_URL=http://localhost:3002
    container_name: strapi-app
    restart: always
    environment:
      - NODE_ENV=production
      - STRAPI_ADMIN_BACKEND_URL=http://localhost:3002
    env_file: .env
    ports:
      - "3002:3002"
    networks:
      - jobs-net
    depends_on:
      - jobs-db

networks:
  jobs-net:
    name: jobs-shared-network
    driver: bridge

volumes:
  strapi-data: