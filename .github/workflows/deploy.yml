# Builds on Node 22 in CI, then uploads without node_modules.
# On cPanel: use "Setup Node.js App" with Node 20+, then in the app directory run:
#   npm ci --omit=dev
# (Or include node_modules in the upload instead—large/slow over FTP.)
name: Deploy Strapi App to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.18.0
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build Strapi app
      run: npm run build

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.CPANEL_DIR }}
        local-dir: ./
        protocol: ftp
        exclude: |
          .git/**
          .github/**
          node_modules/**
          .env
          .env.*
          **/.env
          **/.env.*
          *.log
