# Install + build on GitHub (enough RAM). Upload node_modules — do NOT run npm i on cPanel
# (shared hosting OOM-kills Strapi installs: "Killed").
name: Deploy Strapi App to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.18.0
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build Strapi app
      env:
        NODE_ENV: production
        PUBLIC_URL: https://jobs-api.bluemoongt.com
      run: npm run build

    - name: Prune dev dependencies
      run: npm prune --omit=dev

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.CPANEL_DIR }}
        local-dir: ./
        protocol: ftp
        exclude: |
          .git/**
          .github/**
          .env
          .env.*
          **/.env
          **/.env.*
          *.log
          tmp/**
          .cache/**
          .tmp/**
